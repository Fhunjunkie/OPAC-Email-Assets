name: Import OPAC Halloween Email Graphics

on:
  push:
    paths:
      - '.github/workflows/import-halloween-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-image-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p halloween-2026/assets
          curl --fail --location --silent --show-error --retry 6 --retry-delay 8 --retry-all-errors \
            'https://static.wixstatic.com/media/4b76d2_c1f6b4e942a942b181d73d47118f2d21~mv2.png' \
            --output halloween-2026/assets/header-corrected.png
          curl --fail --location --silent --show-error --retry 6 --retry-delay 8 --retry-all-errors \
            'https://static.wixstatic.com/media/4b76d2_55f8eb7af2fc46b28414ef8619de4ce4~mv2.png' \
            --output halloween-2026/assets/original-footer.png
          for path in halloween-2026/assets/*.png; do
            test "$(file -b --mime-type "$path")" = 'image/png'
            test "$(stat -c%s "$path")" -gt 10000
          done
      - name: Commit image copies to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add halloween-2026/assets
          if ! git diff --cached --quiet; then
            git commit -m "Host original Hall-O-Advocacy email graphics in GitHub"
            git push
          fi
